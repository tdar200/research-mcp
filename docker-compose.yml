services:
  searxng:
    image: searxng/searxng:latest
    container_name: research-mcp-searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./searxng-config:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8888/
      - INSTANCE_NAME=research-mcp-searxng
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: research-mcp-crawl4ai
    restart: unless-stopped
    ports:
      - "11235:11235"
    shm_size: "3gb"
    environment:
      - INSTALL_TYPE=basic
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
